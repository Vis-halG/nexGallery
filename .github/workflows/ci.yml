name: Verify Android and Windows

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Android ARM builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.4
          channel: stable
          cache: true

      - name: Dependencies
        run: flutter pub get

      - name: Format, analyze and test
        run: |
          dart format --output=none --set-exit-if-changed lib test
          flutter analyze
          flutter test

      - name: Build small ARM APKs
        run: |
          flutter build apk --release \
            --split-per-abi \
            --target-platform android-arm,android-arm64 \
            --obfuscate \
            --split-debug-info=build/symbols/android \
            --android-project-arg=allowDevelopmentSigning=true

      - name: Enforce split APK size budget
        shell: bash
        run: |
          limit=$((30 * 1024 * 1024))
          for apk in build/app/outputs/flutter-apk/app-*-release.apk; do
            bytes=$(stat -c%s "$apk")
            echo "$(basename "$apk"): $bytes bytes"
            test "$bytes" -le "$limit"
          done

      - name: Build universal ARM fallback
        run: |
          flutter build apk --release \
            --target-platform android-arm,android-arm64 \
            --obfuscate \
            --split-debug-info=build/symbols/android-universal \
            --android-project-arg=allowDevelopmentSigning=true
          cp build/app/outputs/flutter-apk/app-release.apk \
            build/app/outputs/flutter-apk/nexGallery-universal.apk

      - name: Enforce universal APK size budget
        shell: bash
        run: |
          limit=$((40 * 1024 * 1024))
          apk=build/app/outputs/flutter-apk/nexGallery-universal.apk
          bytes=$(stat -c%s "$apk")
          echo "$(basename "$apk"): $bytes bytes"
          test "$bytes" -le "$limit"

      - name: Verify alignment, signature and manifest
        shell: bash
        run: |
          build_tools="$(find "$ANDROID_SDK_ROOT/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          apks=(
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/nexGallery-universal.apk
          )
          for apk in "${apks[@]}"; do
            "$build_tools/zipalign" -c -P 16 -v 4 "$apk"
            "$build_tools/apksigner" verify --verbose "$apk"
            badging="$("$build_tools/aapt2" dump badging "$apk")"
            grep -q "^package: name='com.thenex.nex_gallery'" <<< "$badging"
            grep -q "^minSdkVersion:'24'" <<< "$badging"
            grep -q "^targetSdkVersion:'36'" <<< "$badging"
          done
          sha256sum "${apks[@]}" > build/app/outputs/flutter-apk/SHA256SUMS.txt

      - name: Android lint
        working-directory: android
        run: bash ./gradlew -PallowDevelopmentSigning=true lintRelease

      - uses: actions/upload-artifact@v4
        with:
          name: nexGallery-android-development-signed
          if-no-files-found: error
          path: |
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/nexGallery-universal.apk
            build/app/outputs/flutter-apk/SHA256SUMS.txt
            build/symbols/

  windows:
    name: Windows x64 build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.4
          channel: stable
          cache: true

      - name: Dependencies and build
        run: |
          flutter pub get
          flutter build windows --release

      - uses: actions/upload-artifact@v4
        with:
          name: nexGallery-windows-foundation
          if-no-files-found: error
          path: build/windows/x64/runner/Release/
