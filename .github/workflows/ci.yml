name: Verify Android and Windows

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Android ARM builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.4
          channel: stable
          cache: true

      - name: Dependencies
        run: flutter pub get

      - name: Format, analyze and test
        run: |
          dart format --output=none --set-exit-if-changed lib test integration_test tool
          flutter analyze
          flutter test --exclude-tags performance
          # The 100,000-item budget runs alone so other suites cannot skew it.
          flutter test --tags performance

      - name: Build small ARM APKs
        run: |
          flutter build apk --release \
            --split-per-abi \
            --target-platform android-arm,android-arm64 \
            --obfuscate \
            --split-debug-info=build/symbols/android \
            --android-project-arg=allowDevelopmentSigning=true

      - name: Enforce split APK size budget
        shell: bash
        run: |
          limit=$((30 * 1024 * 1024))
          for apk in build/app/outputs/flutter-apk/app-*-release.apk; do
            bytes=$(stat -c%s "$apk")
            echo "$(basename "$apk"): $bytes bytes"
            test "$bytes" -le "$limit"
          done

      - name: Build universal ARM fallback
        run: |
          flutter build apk --release \
            --target-platform android-arm,android-arm64 \
            --obfuscate \
            --split-debug-info=build/symbols/android-universal \
            --android-project-arg=allowDevelopmentSigning=true
          cp build/app/outputs/flutter-apk/app-release.apk \
            build/app/outputs/flutter-apk/nexGallery-universal.apk

      - name: Enforce universal APK size budget
        shell: bash
        run: |
          # Reviewed 18 Oct 2026 for ONNX Runtime (about 20 MB compressed for both
          # ABIs); the split APKs remain the main download.
          limit=$((45 * 1024 * 1024))
          apk=build/app/outputs/flutter-apk/nexGallery-universal.apk
          bytes=$(stat -c%s "$apk")
          echo "$(basename "$apk"): $bytes bytes"
          test "$bytes" -le "$limit"

      - name: Verify alignment, signature and manifest
        shell: bash
        run: |
          build_tools="$(find "$ANDROID_SDK_ROOT/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          apks=(
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/nexGallery-universal.apk
          )
          for apk in "${apks[@]}"; do
            "$build_tools/zipalign" -c -P 16 -v 4 "$apk"
            "$build_tools/apksigner" verify --verbose "$apk"
            badging="$("$build_tools/aapt2" dump badging "$apk")"
            grep -q "^package: name='com.thenex.nex_gallery'" <<< "$badging"
            grep -q "^minSdkVersion:'24'" <<< "$badging"
            grep -q "^targetSdkVersion:'36'" <<< "$badging"
          done
          sha256sum "${apks[@]}" > build/app/outputs/flutter-apk/SHA256SUMS.txt

      - name: Android lint
        working-directory: android
        # App module only: plugin modules are linted against their own lower
        # minSdk (flutter_onnxruntime 1.9.0 fails NewApi there at API 21).
        run: bash ./gradlew -PallowDevelopmentSigning=true :app:lintRelease

      - uses: actions/upload-artifact@v7
        with:
          name: nexGallery-android-development-signed
          if-no-files-found: error
          path: |
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/nexGallery-universal.apk
            build/app/outputs/flutter-apk/SHA256SUMS.txt
            build/symbols/

  windows:
    name: Windows x64 build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.4
          channel: stable
          cache: true

      - name: Dependencies
        run: flutter pub get

      - name: PC server tests and executables
        run: |
          dart run windows/server/test/remote_server_smoke_test.dart
          dart run tool/build_server.dart
          dart run windows/server/test/compiled_exe_smoke_test.dart

      # The CMake install step copies the background agent next to the app.
      - name: Build
        run: |
          flutter build windows --release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\tool\verify_windows_bundle.ps1

      - name: Installer (unsigned development build)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y }
          $version = (Select-String -Path pubspec.yaml -Pattern '^version:\s*([0-9.]+)').Matches[0].Groups[1].Value
          & $iscc "/DAppVersion=$version" windows\installer\nexgallery.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-FileHash build\installer\*.exe -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } |
            Set-Content build\installer\SHA256SUMS.txt

      - uses: actions/upload-artifact@v7
        with:
          name: nexGallery-windows-development
          if-no-files-found: error
          path: |
            build/windows/x64/runner/Release/
            build/installer/
